{% extends 'base.html' %}
{% load static %}
{% block title %}contact{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'contact.css' %}">
<div class="contact">
    <h1>CONTACT US</h1>
<p>address: idkSomoniSTREET</p>

<form method="POST" >
    {% csrf_token %}
    <label for="name">NAME:</label>
    <input type="text" id="name" name="name">
    <br><br>
    <label for="text">FEEDBACK:</label>
    <textarea id="text" name="text"  placeholder="write about our cinema"></textarea>
    <br><br>
    <button type="submit">SEND FEEDBACK</button>
</form>
</div>
{% endblock %}
