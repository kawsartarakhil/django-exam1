{% extends 'base.html' %}
{% block title %}Feedback{% endblock %}
{% block content %}

<h1>PEOPLE'S FEEDBACK</h1>

{% for i in feedbacks %}
<div class="feedback">
    <h3>{{ i.name }}</h3>
    <p>{{ i.text }}</p>
    <a href="{% url 'update_feedback' i.id %}"><button type="button">UPDATE</button></a>
    <a href="{% url 'delete_feedback' i.id %}"><button type="button">DELETE</button></a>
</div>
<hr>
{% empty %}
<p>No feedback yet.</p>
{% endfor %}

{% endblock %}
