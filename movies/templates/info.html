{% extends 'base.html' %}

{% block title %}Movie info{% endblock %}

{% block content %}
<h1>{{movie.title}}</h1>

<img src="{{movie.image.url}}" alt="{{movie.title}}" width="200">
<p>Duration: {{movie.duration}} minutes</p>
<p>Age range: {{movie.age_range}}+</p>
<p>Genre: {{movie.genre}}</p>
<a href="{% url 'movie_update' movie.id %}"><button><h1>UPDATE MOVIE</h1></button></a>
<a href="{% url 'movie_delete' movie.id %}"><button><h1>DELETE MOVIE</h1></button></a>
{% endblock %}
