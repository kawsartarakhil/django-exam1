{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Movie{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'info.css' %}">
<div class="movie_info">
    <h1>DELETE MOVIE</h1>
<p>Are you sure you want to delete {{movie.title}}?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="delete">YES, DELETE</button>
</form>
<a href="{% url 'home' %}"><button class="update">CANCEL</button></a>
</div>
{% endblock %}
