{% extends 'base.html' %}

{% block title %}update{% endblock %}

{% block content %}
<h1>UPDATE A  MOVIE</h1>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <label for="title">TITLE:</label>
    <input type="text" id="title" name="title" value="{{movie.title}}">
    <br><br>
    <label for="duration">DURATION:</label>
    <input type="number" id="duration" name="duration" value="{{movie.duration}}">
    <br><br>
    <label for="age_range">AGE RANGE:</label>
    <input type="number" name="age_range" id="age_range" value="{{movie.age_range}}">
    <br><br>
    <label for="image">IMAGE</label>
    <input type="file" id="image" name="image">
    <br><br>
    <label for="genre">GENRE:</label>
    <select name="genre" id="genre">
        {% for i in genre %}
        <option value="{{i.id}}" {% if i.id == movie.genre.id %}selected{% endif %}>{{i.genre}}</option>
        {% endfor %}
    </select>
    <button type="submit">UPDATE</button>
</form>
{% endblock %}
